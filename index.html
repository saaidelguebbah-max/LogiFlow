<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogiFlow - إدارة اللوجيستيك</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #0d6efd;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px #ddd;
    }

    .card h2 {
      margin-top: 0;
      color: #0d6efd;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #0d6efd;
      color: white;
      font-size: 16px;
    }

    button:active {
      background: #084298;
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🚚 LogiFlow</h1>
  <p>تطبيق إدارة اللوجيستيك</p>
</header>

<div class="container">

  <div class="cards">

    <div class="card">
      <h2>📦 المخزون</h2>
      <p>تتبع السلع والمنتجات الموجودة في المخزن.</p>
      <button onclick="alert('قسم المخزون')">
        فتح المخزون
      </button>
    </div>

    <div class="card">
      <h2>🚛 النقل</h2>
      <p>تتبع الشاحنات وعمليات النقل.</p>
      <button onclick="alert('قسم النقل')">
        فتح النقل
      </button>
    </div>

    <div class="card">
      <h2>📋 الطلبات</h2>
      <p>إضافة وتتبع طلبات الزبناء.</p>
      <button onclick="alert('قسم الطلبات')">
        فتح الطلبات
      </button>
    </div>

    <div class="card">
      <h2>📍 التتبع</h2>
      <p>متابعة حالة عمليات التوصيل.</p>
      <button onclick="alert('قسم التتبع')">
        فتح التتبع
      </button>
    </div>

  </div>

</div>

</body>
    </html>
