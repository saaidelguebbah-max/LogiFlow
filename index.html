<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogiFlow V3</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#222;
}

header{
background:#0d6efd;
color:white;
text-align:center;
padding:20px;
}

header h1{margin:0}

.container{
max-width:1000px;
margin:auto;
padding:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:15px;
}

.stat{
background:white;
padding:15px;
text-align:center;
border-radius:12px;
box-shadow:0 2px 8px #ddd;
}

.stat strong{
display:block;
color:#0d6efd;
font-size:24px;
margin-top:5px;
}

.menu{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-bottom:15px;
}

.menu button{
background:white;
padding:12px 5px;
border:0;
border-radius:10px;
box-shadow:0 2px 7px #ddd;
font-size:14px;
}

.menu button.active{
background:#0d6efd;
color:white;
}

.section{
display:none;
background:white;
padding:18px;
border-radius:15px;
box-shadow:0 2px 8px #ddd;
}

.section.active{
display:block;
}

h2{
color:#0d6efd;
margin-top:0;
}

input,select{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

button{
border:0;
border-radius:8px;
padding:10px 13px;
font-size:14px;
}

.primary{
width:100%;
background:#0d6efd;
color:white;
margin-top:8px;
}

.item{
background:#fafafa;
border:1px solid #eee;
border-radius:12px;
padding:14px;
margin-top:12px;
}

.item.low{
border:2px solid #dc3545;
background:#fff5f5;
}

.actions{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
margin-top:10px;
}

.in{
background:#198754;
color:white;
}

.out{
background:#fd7e14;
color:white;
}

.edit{
background:#ffc107;
}

.delete{
background:#dc3545;
color:white;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#e7f1ff;
color:#0d6efd;
margin-top:5px;
}

.warning{
color:#dc3545;
font-weight:bold;
margin-top:8px;
}

.status{
background:#e7f1ff;
color:#0d6efd;
padding:5px 8px;
border-radius:15px;
}

.empty{
text-align:center;
color:#777;
padding:20px;
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr 1fr;
}

.menu{
grid-template-columns:1fr 1fr;
}

.actions{
grid-template-columns:1fr 1fr;
}

}
</style>
</head>

<body>

<header>

<h1>🚚 LogiFlow</h1>

<p>نظام إدارة اللوجيستيك</p>

</header>

<div class="container">

<!-- الإحصائيات -->

<div class="stats">

<div class="stat">
📦 المنتجات
<strong id="productCount">0</strong>
</div>

<div class="stat">
📊 الكمية
<strong id="totalQty">0</strong>
</div>

<div class="stat">
📋 الطلبات
<strong id="orderCount">0</strong>
</div>

<div class="stat">
🚛 الشاحنات
<strong id="truckCount">0</strong>
</div>

</div>

<!-- القائمة -->

<div class="menu">

<button class="active"
onclick="showSection('stock',this)">
📦 المخزون
</button>

<button onclick="showSection('orders',this)">
📋 الطلبات
</button>

<button onclick="showSection('trucks',this)">
🚛 النقل
</button>

<button onclick="showSection('tracking',this)">
📍 التتبع
</button>

</div>


<!-- ================= المخزون ================= -->

<div id="stock" class="section active">

<h2>📦 إدارة المخزون</h2>

<input
id="productName"
placeholder="اسم المنتج">

<input
id="productQty"
type="number"
min="1"
placeholder="الكمية">

<button class="primary"
onclick="addProduct()">

➕ إضافة منتج

</button>

<input
id="productSearch"
placeholder="🔎 البحث عن منتج"
oninput="renderProducts()">

<div id="productList"></div>

</div>


<!-- ================= الطلبات ================= -->

<div id="orders" class="section">

<h2>📋 إدارة الطلبات</h2>

<input
id="customerName"
placeholder="اسم الزبون">

<input
id="customerPhone"
placeholder="رقم الهاتف">

<input
id="orderProduct"
placeholder="اسم المنتج">

<input
id="orderQty"
type="number"
min="1"
placeholder="الكمية">

<button class="primary"
onclick="addOrder()">

➕ إنشاء طلب

</button>

<input
id="orderSearch"
placeholder="🔎 البحث عن طلب"
oninput="renderOrders()">

<div id="orderList"></div>

</div>


<!-- ================= النقل ================= -->

<div id="trucks" class="section">

<h2>🚛 إدارة النقل</h2>

<input
id="truckNumber"
placeholder="رقم الشاحنة">

<input
id="driverName"
placeholder="اسم السائق">

<button class="primary"
onclick="addTruck()">

➕ إضافة شاحنة

</button>

<div id="truckList"></div>

</div>


<!-- ================= التتبع ================= -->

<div id="tracking" class="section">

<h2>📍 تتبع الطلبات</h2>

<div id="trackingList"></div>

</div>

</div>


<script>

/* ================= البيانات ================= */

let products =
JSON.parse(
localStorage.getItem("logiflow_products") || "[]"
);

let orders =
JSON.parse(
localStorage.getItem("logiflow_orders") || "[]"
);

let trucks =
JSON.parse(
localStorage.getItem("logiflow_trucks") || "[]"
);


/* ================= الحفظ ================= */

function saveAll(){

localStorage.setItem(
"logiflow_products",
JSON.stringify(products)
);

localStorage.setItem(
"logiflow_orders",
JSON.stringify(orders)
);

localStorage.setItem(
"logiflow_trucks",
JSON.stringify(trucks)
);

updateStats();

}


/* ================= الإحصائيات ================= */

function updateStats(){

document.getElementById("productCount")
.textContent=products.length;

let total=products.reduce(
(sum,p)=>sum+Number(p.qty),0
);

document.getElementById("totalQty")
.textContent=total;

document.getElementById("orderCount")
.textContent=orders.length;

document.getElementById("truckCount")
.textContent=trucks.length;

}


/* ================= التنقل ================= */

function showSection(id,button){

document
.querySelectorAll(".section")
.forEach(s=>s.classList.remove("active"));

document
.querySelectorAll(".menu button")
.forEach(b=>b.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

button.classList.add("active");

if(id==="stock"){
renderProducts();
}

if(id==="orders"){
renderOrders();
}

if(id==="trucks"){
renderTrucks();
}

if(id==="tracking"){
renderTracking();
}

}


/* ================= إضافة منتج ================= */

function addProduct(){

let name=
document.getElementById("productName")
.value.trim();

let qty=
Number(
document.getElementById("productQty").value
);

if(!name || qty<=0){

alert("دخل اسم المنتج والكمية");

return;

}

let product={

id:Date.now(),

code:"P-"+Date.now().toString().slice(-6),

name:name,

qty:qty

};

products.push(product);

document.getElementById("productName").value="";

document.getElementById("productQty").value="";

saveAll();

renderProducts();

alert("تمت إضافة المنتج ✅");

}


/* ================= عرض المنتجات ================= */

function renderProducts(){

let list=
document.getElementById("productList");

let search=
(document.getElementById("productSearch")
.value || "")
.toLowerCase();

let filtered=
products.filter(p=>
p.name.toLowerCase().includes(search)
);

if(filtered.length===0){

list.innerHTML=
'<div class="empty">لا توجد منتجات</div>';

return;

}

list.innerHTML=

filtered.map(p=>{

let low=Number(p.qty)<10;

return `

<div class="item ${low?"low":""}">

<b>📦 ${p.name}</b>

<br>

الكود:
<span class="badge">
${p.code}
</span>

<br>

الكمية الحالية:
<strong>${p.qty}</strong>

${low?

`<div class="warning">
⚠️ المخزون منخفض
</div>`:""}

<div class="actions">

<button class="in"
onclick="stockIn(${p.id})">
➕ دخول
</button>

<button class="out"
onclick="stockOut(${p.id})">
➖ خروج
</button>

<button class="edit"
onclick="editProduct(${p.id})">
✏️ تعديل
</button>

<button class="delete"
onclick="deleteProduct(${p.id})">
🗑️ حذف
</button>

</div>

</div>

`;

}).join("");

}


/* ================= دخول المخزون ================= */

function stockIn(id){

let product=
products.find(p=>p.id===id);

let amount=
Number(
prompt("شحال من وحدة دخلات؟")
);

if(!amount || amount<=0){
return;
}

product.qty+=amount;

saveAll();

renderProducts();

}


/* ================= خروج المخزون ================= */

function stockOut(id){

let product=
products.find(p=>p.id===id);

let amount=
Number(
prompt("شحال من وحدة خرجات؟")
);

if(!amount || amount<=0){
return;
}

if(amount>product.qty){

alert("❌ الكمية غير كافية");

return;

}

product.qty-=amount;

saveAll();

renderProducts();

}


/* ================= تعديل المنتج ================= */

function editProduct(id){

let product=
products.find(p=>p.id===id);

let name=
prompt(
"اسم المنتج:",
product.name
);

if(name===null || !name.trim()){
return;
}

let qty=
Number(
prompt(
"الكمية:",
product.qty
)
);

if(isNaN(qty)||qty<0){

alert("الكمية غير صحيحة");

return;

}

product.name=name.trim();

product.qty=qty;

saveAll();

renderProducts();

}


/* ================= حذف المنتج ================= */

function deleteProduct(id){

if(!confirm(
"واش متأكد بغيتي تحذف المنتج؟"
)){

return;

}

products=
products.filter(
p=>p.id!==id
);

saveAll();

renderProducts();

}


/* ================= إضافة طلب ================= */

function addOrder(){

let customer=
document.getElementById("customerName")
.value.trim();

let phone=
document.getElementById("customerPhone")
.value.trim();

let product=
document.getElementById("orderProduct")
.value.trim();

let qty=
Number(
document.getElementById("orderQty")
.value
);

if(!customer||!product||qty<=0){

alert("دخل معلومات الطلب كاملة");

return;

}

let order={

id:Date.now(),

number:
"ORD-"+Date.now().toString().slice(-6),

customer:customer,

phone:phone,

product:product,

qty:qty,

status:"جديد",

truck:"",

driver:"",

date:
new Date().toLocaleDateString("ar-MA")

};

orders.push(order);

document.getElementById("customerName").value="";

document.getElementById("customerPhone").value="";

document.getElementById("orderProduct").value="";

document.getElementById("orderQty").value="";

saveAll();

renderOrders();

alert("تم إنشاء الطلب ✅");

}


/* ================= عرض الطلبات ================= */

function renderOrders(){

let list=
document.getElementById("orderList");

let search=
(document.getElementById("orderSearch")
.value||"").toLowerCase();

let filtered=
orders.filter(o=>
o.number.toLowerCase().includes(search) ||
o.customer.toLowerCase().includes(search) ||
o.product.toLowerCase().includes(search)
);

if(filtered.length===0){

list.innerHTML=
'<div class="empty">لا توجد طلبات</div>';

return;

}

list.innerHTML=

filtered.map(o=>`

<div class="item">

<b>📋 ${o.number}</b>

<br>

👤 الزبون:
${o.customer}

<br>

📞 الهاتف:
${o.phone||"غير محدد"}

<br>

📦 المنتج:
${o.product}

<br>

الكمية:
<strong>${o.qty}</strong>

<br>

📅 التاريخ:
${o.date}

<br>

الحالة:

<select
onchange="changeOrderStatus(${o.id},this.value)"
>

<option ${o.status==="جديد"?"selected":""}>
جديد
</option>

<option ${o.status==="قيد التحضير"?"selected":""}>
قيد التحضير
</option>

<option ${o.status==="قيد التوصيل"?"selected":""}>
قيد التوصيل
</option>

<option ${o.status==="تم التسليم"?"selected":""}>
تم التسليم
</option>

</select>

<br>

🚛 الشاحنة:

<select
onchange="assignTruck(${o.id},this.value)"
>

<option value="">
بدون شاحنة
</option>

${trucks.map(t=>`

<option
value="${t.id}"
${String(o.truck)===String(t.id)?"selected":""}
>

${t.number} - ${t.driver}

</option>

`).join("")}

</select>

<div class="actions">

<button class="edit"
onclick="editOrder(${o.id})">
✏️ تعديل
</button>

<button class="delete"
onclick="deleteOrder(${o.id})">
🗑️ حذف
</button>

</div>

</div>

`).join("");

}


/* ================= تغيير حالة الطلب ================= */

function changeOrderStatus(id,status){

let order=
orders.find(o=>o.id===id);

if(!order)return;

order.status=status;

saveAll();

renderOrders();

renderTracking();

}


/* ================= ربط الشاحنة ================= */

function assignTruck(id,truckId){

let order=
orders.find(o=>o.id===id);

if(!order)return;

order.truck=truckId;

let truck=
trucks.find(t=>String(t.id)===String(truckId));

order.driver=
truck?truck.driver:"";

saveAll();

renderOrders();

renderTracking();

}


/* ================= تعديل الطلب ================= */

function editOrder(id){

let order=
orders.find(o=>o.id===id);

if(!order)return;

let customer=
prompt(
"اسم الزبون:",
order.customer
);

if(customer===null)return;

let phone=
prompt(
"رقم الهاتف:",
order.phone
);

if(phone===null)return;

let product=
prompt(
"المنتج:",
order.product
);

if(product===null)return;

let qty=
Number(
prompt(
"الكمية:",
order.qty
)
);

if(isNaN(qty)||qty<=0){

alert("الكمية غير صحيحة");

return;

}

order.customer=customer;

order.phone=phone;

order.product=product;

order.qty=qty;

saveAll();

renderOrders();

}


/* ================= حذف الطلب ================= */

function deleteOrder(id){

if(!confirm(
"واش متأكد بغيتي تحذف الطلب؟"
)){

return;

}

orders=
orders.filter(
o=>o.id!==id
);

saveAll();

renderOrders();

renderTracking();

}


/* ================= إضافة شاحنة ================= */

function addTruck(){

let number=
document.getElementById("truckNumber")
.value.trim();

let driver=
document.getElementById("driverName")
.value.trim();

if(!number||!driver){

alert(
"دخل رقم الشاحنة واسم السائق"
);

return;

}

trucks.push({

id:Date.now(),

number:number,

driver:driver

});

document.getElementById("truckNumber")
.value="";

document.getElementById("driverName")
.value="";

saveAll();

renderTrucks();

alert("تمت إضافة الشاحنة ✅");

}


/* ================= عرض الشاحنات ================= */

function renderTrucks(){

let list=
document.getElementById("truckList");

if(trucks.length===0){

list.innerHTML=
'<div class="empty">لا توجد شاحنات</div>';

return;

}

list.innerHTML=

trucks.map(t=>`

<div class="item">

<b>🚛 ${t.number}</b>

<br>

👤 السائق:
${t.driver}

<div class="actions">

<button class="edit"
onclick="editTruck(${t.id})">
✏️ تعديل
</button>

<button class="delete"
onclick="deleteTruck(${t.id})">
🗑️ حذف
</button>

</div>

</div>

`).join("");

}


/* ================= تعديل الشاحنة ================= */

function editTruck(id){

let truck=
trucks.find(t=>t.id===id);

if(!truck)return;

let number=
prompt(
"رقم الشاحنة:",
truck.number
);

if(number===null)return;

let driver=
prompt(
"اسم السائق:",
truck.driver
);

if(driver===null)return;

truck.number=number;

truck.driver=driver;

saveAll();

renderTrucks();

renderOrders();

}


/* ================= حذف الشاحنة ================= */

function deleteTruck(id){

if(!confirm(
"واش متأكد بغيتي تحذف الشاحنة؟"
)){

return;

}

trucks=
trucks.filter(
t=>t.id!==id
);

orders.forEach(o=>{

if(String(o.truck)===String(id)){

o.truck="";

o.driver="";

}

});

saveAll();

renderTrucks();

renderOrders();

}


/* ================= التتبع ================= */

function renderTracking(){

let list=
document.getElementById("trackingList");

if(orders.length===0){

list.innerHTML=
'<div class="empty">لا توجد طلبات للتتبع</div>';

return;

}

list.innerHTML=

orders.map(o=>{

let truck=
trucks.find(
t=>String(t.id)===String(o.truck)
);

return `

<div class="item">

<b>📍 ${o.number}</b>

<br>

👤 الزبون:
${o.customer}

<br>

📦 ${o.product}
× ${o.qty}

<br>

الحالة:

<span class="status">
${o.status}
</span>

<br>

🚛 الشاحنة:
${truck?
truck.number+" - "+truck.driver:
"لم يتم تعيين شاحنة"}

</div>

`;

}).join("");

}


/* ================= التشغيل ================= */

renderProducts();

renderOrders();

renderTrucks();

renderTracking();

updateStats();

</script>

</body>
  </html>
