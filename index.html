<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogiFlow V2</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222
}
header{
  background:#0d6efd;
  color:white;
  text-align:center;
  padding:20px
}
header h1{margin:0}
.container{
  max-width:1000px;
  margin:auto;
  padding:15px
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px
}
.stat{
  background:white;
  padding:15px;
  text-align:center;
  border-radius:12px;
  box-shadow:0 2px 8px #ddd
}
.stat strong{
  display:block;
  color:#0d6efd;
  font-size:25px;
  margin-top:5px
}
.card{
  background:white;
  padding:18px;
  border-radius:15px;
  box-shadow:0 2px 8px #ddd
}
input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px
}
button{
  border:0;
  border-radius:8px;
  padding:10px 13px;
  cursor:pointer;
  font-size:14px
}
.primary{
  width:100%;
  background:#0d6efd;
  color:white;
  margin-top:8px
}
.product{
  background:#fafafa;
  border:1px solid #eee;
  border-radius:12px;
  padding:14px;
  margin-top:12px
}
.product.low{
  border:2px solid #dc3545;
  background:#fff5f5
}
.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:10px
}
.in{background:#198754;color:white}
.out{background:#fd7e14;color:white}
.edit{background:#ffc107}
.del{background:#dc3545;color:white}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#e7f1ff;
  color:#0d6efd;
  margin-top:5px
}
.warning{
  color:#dc3545;
  font-weight:bold;
  margin-top:8px
}
.empty{
  text-align:center;
  color:#777;
  padding:20px
}
@media(max-width:600px){
  .stats{grid-template-columns:1fr 1fr}
  .actions{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header>
<h1>🚚 LogiFlow</h1>
<p>إدارة اللوجيستيك والمخزون</p>
</header>

<div class="container">

<div class="stats">
<div class="stat">
📦 المنتجات
<strong id="productCount">0</strong>
</div>

<div class="stat">
📊 مجموع الكمية
<strong id="totalQty">0</strong>
</div>

<div class="stat">
⚠️ مخزون منخفض
<strong id="lowCount">0</strong>
</div>
</div>

<div class="card">

<h2>📦 إدارة المخزون</h2>

<input id="productName" placeholder="اسم المنتج">
<input id="productQty" type="number" min="1" placeholder="الكمية">

<button class="primary" onclick="addProduct()">
➕ إضافة منتج جديد
</button>

<input
id="search"
placeholder="🔎 البحث عن منتج"
oninput="renderProducts()"
>

<div id="productList"></div>

</div>

</div>

<script>

let products =
JSON.parse(localStorage.getItem("logiflow_products") || "[]");

function save(){
localStorage.setItem(
"logiflow_products",
JSON.stringify(products)
);
updateStats();
}

function updateStats(){

document.getElementById("productCount").textContent =
products.length;

let total =
products.reduce((sum,p)=>sum + Number(p.qty),0);

document.getElementById("totalQty").textContent =
total;

let low =
products.filter(p=>Number(p.qty)<10).length;

document.getElementById("lowCount").textContent =
low;
}

function addProduct(){

let name =
document.getElementById("productName").value.trim();

let qty =
Number(document.getElementById("productQty").value);

if(!name || qty<=0){
alert("دخل اسم المنتج والكمية");
return;
}

let product = {

id:Date.now(),

code:"P-"+Date.now().toString().slice(-6),

name:name,

qty:qty

};

products.push(product);

document.getElementById("productName").value="";
document.getElementById("productQty").value="";

save();
renderProducts();

alert("تمت إضافة المنتج بنجاح ✅");
}

function renderProducts(){

let list =
document.getElementById("productList");

let search =
document.getElementById("search").value
.toLowerCase();

let filtered =
products.filter(p=>
p.name.toLowerCase().includes(search)
);

if(filtered.length===0){

list.innerHTML =
'<div class="empty">لا توجد منتجات</div>';

return;
}

list.innerHTML =
filtered.map(p=>{

let low =
Number(p.qty)<10;

return `

<div class="product ${low ? "low":""}">

<b>📦 ${p.name}</b>

<br>

الكود:
<span class="badge">
${p.code}
</span>

<br>

الكمية الحالية:
<strong>${p.qty}</strong>

${low ? `
<div class="warning">
⚠️ تنبيه: المخزون منخفض
</div>
`:""}

<div class="actions">

<button class="in"
onclick="stockIn(${p.id})">
➕ دخول
</button>

<button class="out"
onclick="stockOut(${p.id})">
➖ خروج
</button>

<button class="edit"
onclick="editProduct(${p.id})">
✏️ تعديل
</button>

<button class="del"
onclick="deleteProduct(${p.id})">
🗑️ حذف
</button>

</div>

</div>

`;

}).join("");

}

function stockIn(id){

let product =
products.find(p=>p.id===id);

let amount =
Number(prompt("شحال من وحدة دخلات للمخزون؟"));

if(!amount || amount<=0){
return;
}

product.qty += amount;

save();
renderProducts();
}

function stockOut(id){

let product =
products.find(p=>p.id===id);

let amount =
Number(prompt("شحال من وحدة خرجات من المخزون؟"));

if(!amount || amount<=0){
return;
}

if(amount > product.qty){

alert("❌ الكمية غير كافية في المخزون");

return;
}

product.qty -= amount;

save();
renderProducts();
}

function editProduct(id){

let product =
products.find(p=>p.id===id);

let newName =
prompt("اسم المنتج:",product.name);

if(newName===null || !newName.trim()){
return;
}

let newQty =
Number(prompt("الكمية:",product.qty));

if(isNaN(newQty) || newQty<0){
alert("الكمية غير صحيحة");
return;
}

product.name =
newName.trim();

product.qty =
newQty;

save();
renderProducts();
}

function deleteProduct(id){

if(!confirm("واش متأكد بغيتي تحذف هاد المنتج؟")){
return;
}

products =
products.filter(p=>p.id!==id);

save();
renderProducts();
}

renderProducts();
updateStats();

</script>

</body>
  </html>
