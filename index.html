<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LogiFlow V5</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f6f9;
color:#222;
}

header{
background:#0d6efd;
color:white;
text-align:center;
padding:22px 15px;
}

header h1{margin:0;font-size:30px}
header p{margin:7px 0 0}

.container{
max-width:1000px;
margin:auto;
padding:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:15px;
}

.stat{
background:white;
padding:14px 8px;
text-align:center;
border-radius:14px;
box-shadow:0 2px 8px #ddd;
}

.stat span{
font-size:25px;
}

.stat strong{
display:block;
font-size:23px;
color:#0d6efd;
margin-top:5px;
}

.nav{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-bottom:15px;
}

.nav button{
background:white;
color:#222;
border:0;
padding:12px 5px;
border-radius:10px;
font-size:14px;
box-shadow:0 2px 7px #ddd;
}

.nav button.active{
background:#0d6efd;
color:white;
}

.section{
display:none;
background:white;
padding:18px;
border-radius:15px;
box-shadow:0 2px 8px #ddd;
}

.section.active{
display:block;
}

h2{
margin-top:0;
color:#0d6efd;
}

input,select{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ddd;
border-radius:9px;
font-size:15px;
background:white;
}

button{
border:0;
border-radius:9px;
padding:11px;
font-size:14px;
cursor:pointer;
}

.primary{
width:100%;
background:#0d6efd;
color:white;
margin-top:8px;
}

.item{
background:#fafafa;
border:1px solid #e5e5e5;
border-radius:13px;
padding:15px;
margin-top:12px;
}

.low{
border:2px solid #dc3545;
background:#fff5f5;
}

.warning{
color:#dc3545;
font-weight:bold;
margin-top:8px;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#e7f1ff;
color:#0d6efd;
margin:4px 0;
}

.actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
margin-top:10px;
}

.green{background:#198754;color:white}
.orange{background:#fd7e14;color:white}
.yellow{background:#ffc107;color:#222}
.red{background:#dc3545;color:white}
.purple{background:#6f42c1;color:white}

.status{
display:inline-block;
padding:6px 10px;
border-radius:20px;
background:#e7f1ff;
color:#0d6efd;
margin:5px 0;
}

.empty{
text-align:center;
padding:25px;
color:#777;
}

.search{
margin-top:12px;
}

.footer{
text-align:center;
color:#777;
font-size:13px;
padding:20px;
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr 1fr;
}

.nav{
grid-template-columns:1fr 1fr;
}

}

@media(min-width:701px){

.actions{
grid-template-columns:repeat(4,1fr);
}

}
</style>
</head>

<body>

<header>
<h1>🚚 LogiFlow</h1>
<p>نظام إدارة اللوجيستيك والمخزون</p>
</header>

<div class="container">

<!-- الإحصائيات -->

<div class="stats">

<div class="stat">
<span>📦</span>
<strong id="productCount">0</strong>
منتج
</div>

<div class="stat">
<span>📊</span>
<strong id="totalQty">0</strong>
الكمية
</div>

<div class="stat">
<span>📋</span>
<strong id="orderCount">0</strong>
طلب
</div>

<div class="stat">
<span>🚛</span>
<strong id="truckCount">0</strong>
شاحنة
</div>

</div>


<!-- القائمة -->

<div class="nav">

<button class="active" onclick="openTab('stock',this)">
📦 المخزون
</button>

<button onclick="openTab('orders',this)">
📋 الطلبات
</button>

<button onclick="openTab('transport',this)">
🚛 النقل
</button>

<button onclick="openTab('tracking',this)">
📍 التتبع
</button>

</div>


<!-- المخزون -->

<div id="stock" class="section active">

<h2>📦 إدارة المخزون</h2>

<input id="productName"
placeholder="اسم المنتج">

<input id="productCode"
placeholder="كود المنتج (اختياري)">

<input id="productQty"
type="number"
min="0"
placeholder="الكمية">

<input id="minimumQty"
type="number"
min="0"
placeholder="الحد الأدنى للمخزون">

<button class="primary" onclick="addProduct()">
➕ إضافة المنتج
</button>

<input class="search"
id="productSearch"
placeholder="🔎 البحث عن منتج..."
oninput="renderProducts()">

<div id="productList"></div>

</div>


<!-- الطلبات -->

<div id="orders" class="section">

<h2>📋 إدارة الطلبات</h2>

<input id="customerName"
placeholder="👤 اسم الزبون">

<input id="customerPhone"
placeholder="📞 رقم الهاتف">

<input id="orderProduct"
placeholder="📦 اسم المنتج">

<input id="orderQty"
type="number"
min="1"
placeholder="🔢 الكمية">

<input id="orderAddress"
placeholder="📍 عنوان التوصيل">

<button class="primary" onclick="addOrder()">
➕ إنشاء طلب
</button>

<input class="search"
id="orderSearch"
placeholder="🔎 البحث عن طلب..."
oninput="renderOrders()">

<div id="orderList"></div>

</div>


<!-- النقل -->

<div id="transport" class="section">

<h2>🚛 إدارة النقل</h2>

<input id="truckNumber"
placeholder="🚛 رقم الشاحنة">

<input id="driverName"
placeholder="👤 اسم السائق">

<input id="truckType"
placeholder="نوع الشاحنة">

<button class="primary" onclick="addTruck()">
➕ إضافة شاحنة
</button>

<div id="truckList"></div>

</div>


<!-- التتبع -->

<div id="tracking" class="section">

<h2>📍 تتبع الطلبات</h2>

<div id="trackingList"></div>

</div>

</div>


<div class="footer">
LogiFlow V5 — إدارة اللوجيستيك
</div>


<script>

/* =========================
   البيانات
========================= */

let products=JSON.parse(
localStorage.getItem("logiflow_products")||"[]"
);

let orders=JSON.parse(
localStorage.getItem("logiflow_orders")||"[]"
);

let trucks=JSON.parse(
localStorage.getItem("logiflow_trucks")||"[]"
);


/* =========================
   الحفظ
========================= */

function saveAll(){

localStorage.setItem(
"logiflow_products",
JSON.stringify(products)
);

localStorage.setItem(
"logiflow_orders",
JSON.stringify(orders)
);

localStorage.setItem(
"logiflow_trucks",
JSON.stringify(trucks)
);

updateStats();

}


/* =========================
   الإحصائيات
========================= */

function updateStats(){

document.getElementById("productCount").textContent=
products.length;

document.getElementById("totalQty").textContent=
products.reduce(
(total,p)=>total+Number(p.qty||0),0
);

document.getElementById("orderCount").textContent=
orders.length;

document.getElementById("truckCount").textContent=
trucks.length;

}


/* =========================
   التنقل
========================= */

function openTab(id,button){

document.querySelectorAll(".section")
.forEach(x=>x.classList.remove("active"));

document.querySelectorAll(".nav button")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

button.classList.add("active");

if(id==="stock")renderProducts();
if(id==="orders")renderOrders();
if(id==="transport")renderTrucks();
if(id==="tracking")renderTracking();

}


/* =========================
   إضافة منتج
========================= */

function addProduct(){

let name=document
.getElementById("productName")
.value.trim();

let code=document
.getElementById("productCode")
.value.trim();

let qty=Number(document
.getElementById("productQty")
.value);

let minimum=Number(document
.getElementById("minimumQty")
.value)||10;

if(!name||qty<0){

alert("دخل اسم المنتج والكمية");

return;
}

products.push({

id:Date.now(),

name:name,

code:code||
"P-"+Date.now().toString().slice(-6),

qty:qty,

minimum:minimum

});

document.getElementById("productName").value="";
document.getElementById("productCode").value="";
document.getElementById("productQty").value="";
document.getElementById("minimumQty").value="";

saveAll();
renderProducts();

alert("تمت إضافة المنتج ✅");

}


/* =========================
   عرض المنتجات
========================= */

function renderProducts(){

let list=document.getElementById("productList");

let search=(document
.getElementById("productSearch")
.value||"")
.toLowerCase();

let filtered=products.filter(p=>
p.name.toLowerCase().includes(search)||
p.code.toLowerCase().includes(search)
);

if(filtered.length===0){

list.innerHTML=
'<div class="empty">لا توجد منتجات</div>';

return;
}

list.innerHTML=filtered.map(p=>{

let low=Number(p.qty)<=Number(p.minimum||10);

return`

<div class="item ${low?"low":""}">

<b>📦 ${escapeHTML(p.name)}</b>

<br>

الكود:
<span class="badge">
${escapeHTML(p.code)}
</span>

<br>

الكمية الحالية:
<strong>${p.qty}</strong>

<br>

الحد الأدنى:
${p.minimum||10}

${low?
'<div class="warning">⚠️ المخزون منخفض</div>':
""}

<div class="actions">

<button class="green"
onclick="stockIn(${p.id})">
➕ دخول
</button>

<button class="orange"
onclick="stockOut(${p.id})">
➖ خروج
</button>

<button class="yellow"
onclick="editProduct(${p.id})">
✏️ تعديل
</button>

<button class="red"
onclick="deleteProduct(${p.id})">
🗑️ حذف
</button>

</div>

</div>

`;

}).join("");

}


/* =========================
   دخول المخزون
========================= */

function stockIn(id){

let p=products.find(x=>x.id===id);

if(!p)return;

let amount=Number(
prompt("شحال من وحدة دخلات؟")
);

if(!amount||amount<=0)return;

p.qty+=amount;

saveAll();
renderProducts();

}


/* =========================
   خروج المخزون
========================= */

function stockOut(id){

let p=products.find(x=>x.id===id);

if(!p)return;

let amount=Number(
prompt("شحال من وحدة خرجات؟")
);

if(!amount||amount<=0)return;

if(amount>p.qty){

alert("❌ الكمية الموجودة غير كافية");

return;
}

p.qty-=amount;

saveAll();
renderProducts();

}


/* =========================
   تعديل المنتج
========================= */

function editProduct(id){

let p=products.find(x=>x.id===id);

if(!p)return;

let name=prompt(
"اسم المنتج:",
p.name
);

if(name===null||!name.trim())return;

let qty=Number(
prompt("الكمية:",p.qty)
);

if(isNaN(qty)||qty<0){

alert("الكمية غير صحيحة");

return;
}

let minimum=Number(
prompt("الحد الأدنى:",p.minimum||10)
);

p.name=name.trim();
p.qty=qty;
p.minimum=isNaN(minimum)?10:minimum;

saveAll();
renderProducts();

}


/* =========================
   حذف المنتج
========================= */

function deleteProduct(id){

if(!confirm(
"واش متأكد بغيتي تحذف هاد المنتج؟"
))return;

products=products.filter(
p=>p.id!==id
);

saveAll();
renderProducts();

}


/* =========================
   إضافة طلب
========================= */

function addOrder(){

let customer=document
.getElementById("customerName")
.value.trim();

let phone=document
.getElementById("customerPhone")
.value.trim();

let product=document
.getElementById("orderProduct")
.value.trim();

let qty=Number(document
.getElementById("orderQty")
.value);

let address=document
.getElementById("orderAddress")
.value.trim();

if(!customer||!product||qty<=0){

alert("دخل معلومات الطلب كاملة");

return;
}

orders.push({

id:Date.now(),

number:
"ORD-"+Date.now().toString().slice(-6),

customer:customer,

phone:phone,

product:product,

qty:qty,

address:address,

status:"جديد",

truck:"",

date:new Date().toLocaleDateString("ar-MA"),

time:new Date().toLocaleTimeString("ar-MA")

});

document.getElementById("customerName").value="";
document.getElementById("customerPhone").value="";
document.getElementById("orderProduct").value="";
document.getElementById("orderQty").value="";
document.getElementById("orderAddress").value="";

saveAll();
renderOrders();

alert("تم إنشاء الطلب ✅");

}


/* =========================
   عرض الطلبات
========================= */

function renderOrders(){

let list=document.getElementById("orderList");

let search=(document
.getElementById("orderSearch")
.value||"")
.toLowerCase();

let filtered=orders.filter(o=>
o.number.toLowerCase().includes(search)||
o.customer.toLowerCase().includes(search)||
o.product.toLowerCase().includes(search)
);

if(filtered.length===0){

list.innerHTML=
'<div class="empty">لا توجد طلبات</div>';

return;
}

list.innerHTML=filtered.map(o=>`

<div class="item">

<b>📋 ${escapeHTML(o.number)}</b>

<br><br>

👤 الزبون:
<strong>${escapeHTML(o.customer)}</strong>

<br>

📞 الهاتف:
${escapeHTML(o.phone||"غير محدد")}

<br>

📦 المنتج:
${escapeHTML(o.product)}

<br>

🔢 الكمية:
<strong>${o.qty}</strong>

<br>

📍 العنوان:
${escapeHTML(o.address||"غير محدد")}

<br>

📅 التاريخ:
${o.date}

<br><br>

الحالة:

<select onchange="changeStatus(${o.id},this.value)">

<option ${o.status==="جديد"?"selected":""}>
جديد
</option>

<option ${o.status==="قيد التحضير"?"selected":""}>
قيد التحضير
</option>

<option ${o.status==="قيد التوصيل"?"selected":""}>
قيد التوصيل
</option>

<option ${o.status==="تم التسليم"?"selected":""}>
تم التسليم
</option>

<option ${o.status==="ملغى"?"selected":""}>
ملغى
</option>

</select>

<br>

🚛 الشاحنة:

<select onchange="assignTruck(${o.id},this.value)">

<option value="">
بدون شاحنة
</option>

${trucks.map(t=>`

<option value="${t.id}"
${String(o.truck)===String(t.id)?"selected":""}>

${escapeHTML(t.number)}
-
${escapeHTML(t.driver)}

</option>

`).join("")}

</select>

<div class="actions">

<button class="purple"
onclick="printInvoice(${o.id})">
🧾 فاتورة
</button>

<button class="green"
onclick="sendWhatsApp(${o.id})">
📲 WhatsApp
</button>

<button class="yellow"
onclick="editOrder(${o.id})">
✏️ تعديل
</button>

<button class="red"
onclick="deleteOrder(${o.id})">
🗑️ حذف
</button>

</div>

</div>

`).join("");

}


/* =========================
   تغيير حالة الطلب
========================= */

function changeStatus(id,status){

let o=orders.find(x=>x.id===id);

if(!o)return;

o.status=status;

saveAll();

renderOrders();
renderTracking();

}


/* =========================
   ربط الشاحنة
========================= */

function assignTruck(id,truckId){

let o=orders.find(x=>x.id===id);

if(!o)return;

o.truck=truckId;

saveAll();

renderOrders();
renderTracking();

}


/* =========================
   تعديل الطلب
========================= */

function editOrder(id){

let o=orders.find(x=>x.id===id);

if(!o)return;

let customer=prompt(
"اسم الزبون:",
o.customer
);

if(customer===null)return;

let phone=prompt(
"رقم الهاتف:",
o.phone
);

if(phone===null)return;

let product=prompt(
"المنتج:",
o.product
);

if(product===null)return;

let qty=Number(
prompt("الكمية:",o.qty)
);

if(!qty||qty<=0){

alert("الكمية غير صحيحة");

return;
}

o.customer=customer;
o.phone=phone;
o.product=product;
o.qty=qty;

saveAll();
renderOrders();

}


/* =========================
   حذف الطلب
========================= */

function deleteOrder(id){

if(!confirm(
"واش متأكد بغيتي تحذف هاد الطلب؟"
))return;

orders=orders.filter(
o=>o.id!==id
);

saveAll();

renderOrders();
renderTracking();

}


/* =========================
   الشاحنات
========================= */

function addTruck(){

let number=document
.getElementById("truckNumber")
.value.trim();

let driver=document
.getElementById("driverName")
.value.trim();

let type=document
.getElementById("truckType")
.value.trim();

if(!number||!driver){

alert("دخل رقم الشاحنة واسم السائق");

return;
}

trucks.push({

id:Date.now(),

number:number,

driver:driver,

type:type

});

document.getElementById("truckNumber").value="";
document.getElementById("driverName").value="";
document.getElementById("truckType").value="";

saveAll();
renderTrucks();

alert("تمت إضافة الشاحنة ✅");

}


/* =========================
   عرض الشاحنات
========================= */

function renderTrucks(){

let list=document.getElementById("truckList");

if(trucks.length===0){

list.innerHTML=
'<div class="empty">لا توجد شاحنات</div>';

return;
}

list.innerHTML=trucks.map(t=>`

<div class="item">

<b>🚛 ${escapeHTML(t.number)}</b>

<br>

👤 السائق:
${escapeHTML(t.driver)}

<br>

🚚 النوع:
${escapeHTML(t.type||"غير محدد")}

<div class="actions">

<button class="yellow"
onclick="editTruck(${t.id})">
✏️ تعديل
</button>

<button class="red"
onclick="deleteTruck(${t.id})">
🗑️ حذف
</button>

</div>

</div>

`).join("");

}


/* =========================
   تعديل الشاحنة
========================= */

function editTruck(id){

let t=trucks.find(x=>x.id===id);

if(!t)return;

let number=prompt(
"رقم الشاحنة:",
t.number
);

if(number===null)return;

let driver=prompt(
"اسم السائق:",
t.driver
);

if(driver===null)return;

let type=prompt(
"نوع الشاحنة:",
t.type
);

if(type===null)return;

t.number=number;
t.driver=driver;
t.type=type;

saveAll();

renderTrucks();
renderOrders();

}


/* =========================
   حذف الشاحنة
========================= */

function deleteTruck(id){

if(!confirm(
"واش متأكد بغيتي تحذف هاد الشاحنة؟"
))return;

trucks=trucks.filter(
t=>t.id!==id
);

orders.forEach(o=>{

if(String(o.truck)===String(id)){

o.truck="";

}

});

saveAll();

renderTrucks();
renderOrders();
renderTracking();

}


/* =========================
   التتبع
========================= */

function renderTracking(){

let list=document
.getElementById("trackingList");

if(orders.length===0){

list.innerHTML=
'<div class="empty">لا توجد طلبات للتتبع</div>';

return;
}

list.innerHTML=orders.map(o=>{

let truck=trucks.find(
t=>String(t.id)===String(o.truck)
);

return`

<div class="item">

<b>📍 ${escapeHTML(o.number)}</b>

<br><br>

👤 ${escapeHTML(o.customer)}

<br>

📦 ${escapeHTML(o.product)}
×
${o.qty}

<br>

📅 ${o.date}

<br>

الحالة:

<span class="status">
${escapeHTML(o.status)}
</span>

<br>

🚛
${truck?
escapeHTML(truck.number)+" - "+
escapeHTML(truck.driver):
"لم يتم تعيين شاحنة"}

</div>

`;

}).join("");

}


/* =========================
   الفاتورة
========================= */

function printInvoice(id){

let o=orders.find(x=>x.id===id);

if(!o)return;

let truck=trucks.find(
t=>String(t.id)===String(o.truck)
);

let invoice=`

<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>${o.number}</title>

<style>

body{
font-family:Arial;
padding:25px;
background:#fff;
}

.invoice{
max-width:650px;
margin:auto;
border:1px solid #ddd;
padding:25px;
}

h1,h2{
text-align:center;
}

.row{
padding:12px;
border-bottom:1px solid #eee;
}

.footer{
text-align:center;
margin-top:25px;
}

</style>

</head>

<body>

<div class="invoice">

<h1>🚚 LogiFlow</h1>

<h2>🧾 تفاصيل الطلب</h2>

<div class="row">
<strong>رقم الطلب:</strong>
${o.number}
</div>

<div class="row">
<strong>التاريخ:</strong>
${o.date}
</div>

<div class="row">
<strong>الزبون:</strong>
${escapeHTML(o.customer)}
</div>

<div class="row">
<strong>الهاتف:</strong>
${escapeHTML(o.phone||"غير محدد")}
</div>

<div class="row">
<strong>المنتج:</strong>
${escapeHTML(o.product)}
</div>

<div class="row">
<strong>الكمية:</strong>
${o.qty}
</div>

function sendWhatsApp(id){

let o=orders.find(x=>x.id===id);

if(!o)return;

let text=
"🚚 LogiFlow - تفاصيل الطلب\n\n"+
"📋 رقم الطلب: "+o.number+"\n"+
"👤 الزبون: "+o.customer+"\n"+
"📦 المنتج: "+o.product+"\n"+
"🔢 الكمية: "+o.qty+"\n"+
"📍 العنوان: "+(o.address||"غير محدد")+"\n"+
"📌 الحالة: "+o.status+"\n"+
"📅 التاريخ: "+o.date;

let phone=(o.phone||"")
.replace(/\D/g,"");

if(phone.startsWith("0")){
phone="212"+phone.substring(1);
}

let url=phone?
"https://wa.me/"+phone+
"?text="+encodeURIComponent(text):

"https://wa.me/?text="+
encodeURIComponent(text);

window.open(url,"_blank");

}


/* =========================
   حماية النص
========================= */

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
